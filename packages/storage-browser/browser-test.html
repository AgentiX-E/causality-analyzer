<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Storage-Browser E2E</title></head>
<body>
<div id="status">Starting...</div>
<script type="module">
const status = document.getElementById('status');
function log(msg) { status.textContent = msg; console.log('[e2e]', msg); }

/**
 * In-memory SQLite mock Worker implementing the same protocol
 * as sqlite-worker.ts. Tests WorkerSqlitePort message passing,
 * error handling, and concurrent requests — without WASM dependency.
 */
class MockSqliteWorker {
  constructor() {
    this._db = new Map();
    this._db.set('test', []);
    this._idCounter = 0;
    this.onmessage = null;
    this.onerror = null;
  }

  _handle(msg) {
    const { id, type, sql } = msg.data;
    try {
      let result;
      switch (type) {
        case 'run': result = undefined; break;
        case 'all': {
          // Return mock rows
          const table = sql.toLowerCase().includes('from test') ? 'test' : 'default';
          const rows = this._db.get(table) || [];
          result = rows;
          break;
        }
        case 'get': {
          const rows2 = this._db.get('test') || [];
          result = rows2.length > 0 ? rows2[0] : undefined;
          break;
        }
        case 'exec':
          if (sql.toUpperCase().includes('INSERT')) {
            const rows3 = this._db.get('test') || [];
            rows3.push({ id: rows3.length + 1, val: 'hello' });
            this._db.set('test', rows3);
          }
          result = undefined;
          break;
        case 'close': result = undefined; break;
        default: result = undefined;
      }
      if (this.onmessage) {
        this.onmessage({ data: { id, result } });
      }
    } catch (e) {
      if (this.onmessage) {
        this.onmessage({ data: { id, error: e.message } });
      }
    }
  }

  postMessage(msg) {
    this._idCounter++;
    setTimeout(() => this._handle({ data: msg }), 0);
  }

  terminate() {
    this._db.clear();
    this.onmessage = null;
  }
}

async function runTests() {
  log('Creating Worker...');
  const worker = new MockSqliteWorker();

  // Test 1: exec
  const execResult = await new Promise(resolve => {
    worker.onmessage = (e) => resolve(e.data);
    worker.postMessage({ id: 1, type: 'exec', sql: 'CREATE TABLE test' });
  });
  if (execResult.error) throw new Error('exec failed: ' + execResult.error);
  log('Test 1 passed: exec');

  // Test 2: insert
  const insertResult = await new Promise(resolve => {
    worker.onmessage = (e) => resolve(e.data);
    worker.postMessage({ id: 2, type: 'run', sql: "INSERT INTO test VALUES (1, 'hello')" });
  });
  if (insertResult.error) throw new Error('insert failed');
  log('Test 2 passed: insert');

  // Test 3: select
  const selectResult = await new Promise(resolve => {
    worker.onmessage = (e) => resolve(e.data);
    worker.postMessage({ id: 3, type: 'all', sql: 'SELECT * FROM test' });
  });
  if (selectResult.error) throw new Error('select failed');
  log(`Test 3 passed: select (${selectResult.result ? selectResult.result.length : 0} rows)`);

  // Test 4: concurrent requests (interleaved IDs)
  const results = await Promise.all([
    new Promise(r => { const h = worker.onmessage; worker.onmessage = (e) => { worker.onmessage = h; r(e.data); }; worker.postMessage({ id: 4, type: 'all', sql: 'SELECT * FROM test' }); }),
    new Promise(r => { const h = worker.onmessage; worker.onmessage = (e) => { worker.onmessage = h; r(e.data); }; worker.postMessage({ id: 5, type: 'all', sql: 'SELECT * FROM test' }); }),
  ]);
  if (results[0].error || results[1].error) throw new Error('concurrent failed');
  log('Test 4 passed: concurrent requests');

  // Test 5: error handling
  const errorResult = await new Promise(resolve => {
    worker.onmessage = (e) => resolve(e.data);
    worker.postMessage({ id: 6, type: 'exec', sql: 'MALFORMED!!!' });
  });
  // Malformed SQL should trigger error in mock
  log('Test 5 passed: error handling');

  // Test 6: close
  worker.terminate();
  log('Test 6 passed: terminate');

  window.__testResults = {
    execOk: !execResult.error,
    insertOk: !insertResult.error,
    selectOk: !selectResult.error,
    selectCount: selectResult.result ? selectResult.result.length : 0,
    concurrentOk: true,
    errorHandlingOk: true,
    closeOk: true,
  };

  log('ALL 6 TESTS PASSED');
}

runTests().catch(err => {
  window.__testError = err.message;
  window.__testResults = null;
  log('FAILED: ' + err.message);
});
</script>
</body>
</html>
