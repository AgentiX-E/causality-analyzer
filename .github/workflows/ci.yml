name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Quality Gates (lint + build + test) ─────────────────────────────
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '22'

  # ═══════════════════════════════════════════════════════════════════════
  # Docker — verify Dockerfile builds on release tags only
  # ═══════════════════════════════════════════════════════════════════════
  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t causality-analyzer:ci .

  # ═══════════════════════════════════════════════════════════════════════
  # GitHub Pages — publish API docs + coverage on push to master
  # ═══════════════════════════════════════════════════════════════════════
  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm config set approve-builds true
      - name: Install dependencies
        run: |
          # Prevent npm postinstall xdg-open from failing on headless CI
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(which true)" "$HOME/.local/bin/xdg-open"
          export PATH="$HOME/.local/bin:$PATH"
          pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - run: pnpm run --filter @agentix-e/causality-analyzer-pipeline build
      - run: pnpm run --filter @agentix-e/causality-analyzer-visual build
      - run: pnpm run --filter @agentix-e/causality-analyzer-storage-browser build
      - name: Generate API docs
        run: pnpm docs
      - name: Prepare pages
        run: node scripts/prepare-pages.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
