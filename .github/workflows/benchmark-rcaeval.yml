name: RCAEval Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        system: [RE1, RE2, RE3]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: 10 }

      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }

      - name: Install dependencies
        run: |
          pnpm config set approve-builds true
          pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm run --filter @agentix-e/causality-analyzer-core build
          pnpm run --filter @agentix-e/causality-analyzer-pipeline build

      - name: Run RCAEval Synthetic Benchmark
        env:
          BENCH_RCA_MAX_SIZE: '64'
          BENCH_RCA_SCENARIOS: '10'
          BENCH_RCA_SEED: '42'
        run: |
          cd packages/pipeline
          npx tsx benchmark/run-rcaeval.ts

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: rcaeval-results-${{ matrix.system }}
          path: packages/pipeline/benchmark-results/benchmark-rcaeval.*
          retention-days: 90
