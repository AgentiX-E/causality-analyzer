name: RCAEval Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        system: [RE1, RE2, RE3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        id: rcaeval-cache
        with:
          path: benchmark-data/rcaeval/
          key: rcaeval-${{ matrix.system }}-v1
      - name: Download RCAEval dataset
        if: steps.rcaeval-cache.outputs.cache-hit != 'true'
        run: |
          pip install rca-eval
          python -c "from rca_eval import download; download.dataset('${{ matrix.system }}')"
          mv ~/.rca_eval/ benchmark-data/rcaeval/
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          pnpm config set approve-builds true
          pnpm install --frozen-lockfile
          pnpm run --filter @agentix-e/causality-analyzer-core build
          pnpm run --filter @agentix-e/causality-analyzer-pipeline build
      - name: Run CA-LLM RCA Agent on RCAEval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          pip install pandas openai rca-eval
          echo "RCAEval agent ready"
      - uses: actions/upload-artifact@v4
        with:
          name: rcaeval-predictions-${{ matrix.system }}
          path: benchmark-results/rcaeval-*.csv
          retention-days: 90
