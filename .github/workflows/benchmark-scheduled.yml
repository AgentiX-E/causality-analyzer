name: Benchmark

on:
  schedule:
    - cron: '0 6 * * *'      # Daily at 06:00 UTC
  workflow_dispatch:           # Manual trigger

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Cross-Dataset — 4 datasets × 9 algorithms precision validation
  # ═══════════════════════════════════════════════════════════════════════
  cross-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - run: pnpm run --filter @agentix-e/causality-analyzer-pipeline build
      - name: Run cross-dataset precision benchmark
        run: |
          pnpm run --filter @agentix-e/causality-analyzer-pipeline test \
            -- src/__tests__/i28-cross-dataset.test.ts \
            2>&1 | tee benchmark-output.log
      - name: Validate against SHD baselines
        run: node scripts/validate-benchmarks.cjs benchmark-output.log
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-output.log
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════
  # Benchmark Parity — algorithm validity and timing check
  # ═══════════════════════════════════════════════════════════════════════
  benchmark-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - run: pnpm run --filter @agentix-e/causality-analyzer-pipeline build
      - name: Run benchmark parity tests
        run: pnpm run --filter @agentix-e/causality-analyzer-pipeline test -- src/__tests__/i68-benchmark-parity.test.ts

  # ═══════════════════════════════════════════════════════════════════════
  # OCDB — Open Causal Discovery Benchmark (standard tier: 8-10 nodes)
  # ═══════════════════════════════════════════════════════════════════════
  ocdb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - run: pnpm run --filter @agentix-e/causality-analyzer-pipeline build
      - name: Run OCDB small-tier benchmark
        run: pnpm run --filter @agentix-e/causality-analyzer-pipeline benchmark:ocdb:ci
      - name: Upload OCDB benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: ocdb-benchmark-results
          path: packages/pipeline/benchmark-results/benchmark-ocdb.*
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════
  # Cross-Language — CA vs causal-learn (Python) head-to-head comparison
  # ═══════════════════════════════════════════════════════════════════════
  cross-language:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - run: pnpm run --filter @agentix-e/causality-analyzer-pipeline build
      - name: Install causal-learn
        run: pip install causal-learn
      - name: Export benchmark data (CSV)
        run: npx tsx packages/pipeline/benchmark/export-benchmark-data.ts
      - name: Run causal-learn benchmark
        run: python3 packages/pipeline/benchmark/run-causal-learn-benchmark.py
      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: cross-language-comparison
          path: packages/pipeline/benchmark-results/cross-language-comparison.*
          retention-days: 90
