name: Quality (reusable)

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version'
        type: string
        default: '22'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core lint
      - run: pnpm run --filter @agentix-e/causality-analyzer-pipeline lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - run: pnpm run --filter @agentix-e/causality-analyzer-pipeline build
      - run: pnpm run --filter @agentix-e/causality-analyzer-storage-browser build
      - run: pnpm run --filter @agentix-e/causality-analyzer-visual build

  test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - name: Core unit tests
        run: cd packages/core && npx vitest run
      - name: Pipeline precision threshold tests
        run: |
          pnpm run --filter @agentix-e/causality-analyzer-core build
          cd packages/pipeline && pnpm exec vitest run src/__tests__/benchmark-precision-thresholds.test.ts

  browser-test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - run: pnpm run --filter @agentix-e/causality-analyzer-storage-browser browser-test

  # neo4j-test moved to ci.yml — requires external Neo4j Docker,
  # not appropriate as a quality gate for core/pipeline packages.

  # audit moved to CI-level job — informational, not a quality gate

