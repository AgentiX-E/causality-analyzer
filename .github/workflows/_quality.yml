name: Quality (reusable)

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version'
        type: string
        default: '22'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core lint
      - run: pnpm run --filter @agentix-e/causality-analyzer-pipeline lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - run: pnpm run --filter @agentix-e/causality-analyzer-pipeline build
      - run: pnpm run --filter @agentix-e/causality-analyzer-storage-browser build
      - run: pnpm run --filter @agentix-e/causality-analyzer-visual build

  test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - name: Core unit tests
        run: cd packages/core && npx vitest run
      - name: Pipeline precision threshold tests
        run: cd packages/pipeline && pnpm exec vitest run src/__tests__/i91-precision-thresholds.test.ts

  browser-test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - run: pnpm run --filter @agentix-e/causality-analyzer-storage-browser browser-test -- src/__tests__/browser-persistence.spec.ts

  neo4j-test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - name: Start Neo4j
        run: |
          docker version 2>&1 || { echo "DOCKER_UNAVAILABLE=true" >> "$GITHUB_ENV"; exit 0; }
          docker rm -f neo4j-ci 2>/dev/null; true
          docker run -d --name neo4j-ci -p 7687:7687 \
            -e NEO4J_AUTH=neo4j/password \
            -e NEO4J_ACCEPT_LICENSE_AGREEMENT=yes \
            neo4j:community
          for i in $(seq 1 60); do
            if docker logs neo4j-ci 2>&1 | grep -q "Started"; then echo "Neo4j ready"; exit 0; fi
            sleep 2
          done
          echo "Neo4j failed to start — skipping tests"; exit 0
      - name: Run tests
        if: env.DOCKER_UNAVAILABLE != 'true'
        run: pnpm run --filter @agentix-e/causality-analyzer-storage-remote test:neo4j
        env: { NEO4J_BOLT_URI: 'bolt://localhost:7687', NEO4J_USER: 'neo4j', NEO4J_PASSWORD: 'password' }
      - name: Cleanup
        if: always()
        run: docker stop neo4j-ci 2>/dev/null; docker rm neo4j-ci 2>/dev/null; exit 0

  # audit moved to CI-level job — informational, not a quality gate

