name: Quality (reusable)

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version'
        type: string
        default: '22'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - run: pnpm run --filter @agentix-e/causality-analyzer-pipeline build
      - run: pnpm run --filter @agentix-e/causality-analyzer-storage-embed build
      - run: pnpm run --filter @agentix-e/causality-analyzer-storage-remote build
      - run: pnpm run --filter @agentix-e/causality-analyzer-storage-browser build
      - run: pnpm run --filter @agentix-e/causality-analyzer-visual build
      - run: pnpm -r typecheck 2>/dev/null || true

  test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test -- --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            packages/*/coverage/
          retention-days: 14

  browser-test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - name: Visual browser tests
        run: pnpm run --filter @agentix-e/causality-analyzer-visual browser-test 2>/dev/null || echo "No visual browser tests"
      - name: Storage-browser Playwright E2E (real wa-sqlite + OPFS)
        run: pnpm run --filter @agentix-e/causality-analyzer-storage-browser browser-test

  neo4j-test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter @agentix-e/causality-analyzer-core build
      - name: Start Neo4j
        run: |
          docker version 2>&1 || { echo "DOCKER_UNAVAILABLE=true" >> "$GITHUB_ENV"; exit 0; }
          docker rm -f neo4j-ci 2>/dev/null; true
          docker run -d --name neo4j-ci -p 7687:7687 \
            -e NEO4J_AUTH=neo4j/password \
            -e NEO4J_ACCEPT_LICENSE_AGREEMENT=yes \
            neo4j:community
          for i in $(seq 1 60); do
            if docker logs neo4j-ci 2>&1 | grep -q "Started"; then echo "Neo4j ready"; exit 0; fi
            sleep 2
          done
          echo "Neo4j failed"; docker logs neo4j-ci 2>&1 | tail -20; exit 1
      - name: Run tests
        if: env.DOCKER_UNAVAILABLE != 'true'
        run: pnpm run --filter @agentix-e/causality-analyzer-storage-remote test:neo4j 2>/dev/null || echo "Neo4j tests skipped"
        env: { NEO4J_BOLT_URI: 'bolt://localhost:7687', NEO4J_USER: 'neo4j', NEO4J_PASSWORD: 'password' }
      - name: Cleanup
        if: always()
        run: docker stop neo4j-ci 2>/dev/null; docker rm neo4j-ci 2>/dev/null; true

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ inputs.node_version }}', cache: 'pnpm' }
      - run: pnpm config set approve-builds true
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high 2>/dev/null || echo "Audit warnings (non-blocking)"
        continue-on-error: true
