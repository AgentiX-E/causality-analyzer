name: OpenRCA Benchmark

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset to evaluate'
        required: true
        type: choice
        options:
          - Telecom
          - Bank
          - Market/cloudbed-1
          - Market/cloudbed-2

permissions:
  contents: read

jobs:
  run-rca-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone OpenRCA framework
        run: git clone https://github.com/microsoft/OpenRCA.git

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r OpenRCA/requirements.txt
          pip install pandas openai gdown

      - name: Build CA packages
        run: |
          pnpm config set approve-builds true
          pnpm install --frozen-lockfile
          pnpm run --filter @agentix-e/causality-analyzer-core build
          pnpm run --filter @agentix-e/causality-analyzer-pipeline build

      - name: Restore dataset cache
        uses: actions/cache@v4
        id: dataset-cache
        with:
          path: OpenRCA/dataset/
          key: openrca-${{ github.event.inputs.dataset }}-v1

      - name: Download dataset from Google Drive
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          # Map system name to Google Drive file ID (from gdown --folder listing)
          case "${{ github.event.inputs.dataset }}" in
            Telecom)          FILE_ID="1cyOKpqyAP4fy-QiJ6a_cKuwR7D46zyVe"; ZIP_NAME="Telecom.zip" ;;
            Bank)             FILE_ID="1enBrdPT3wLG94ITGbSOwUFg9fkLR-16R"; ZIP_NAME="Bank.zip" ;;
            Market/cloudbed-1|Market/cloudbed-2) FILE_ID="1aDbqFHhYGgywLDfq54O7Ln8wgiv-BqGJ"; ZIP_NAME="Market.zip" ;;
            *) echo "Unknown dataset"; exit 1 ;;
          esac

          mkdir -p OpenRCA/dataset

          # Download with exponential backoff (max 3 retries)
          for i in 1 2 3; do
            echo "Attempt $i: downloading $ZIP_NAME..."
            if gdown --id "$FILE_ID" -O "OpenRCA/$ZIP_NAME" 2>&1; then
              echo "Download successful"
              break
            fi
            if [ $i -lt 3 ]; then
              WAIT=$((30 * i))
              echo "Rate-limited. Waiting ${WAIT}s before retry..."
              sleep $WAIT
            else
              echo "All download attempts failed"
              exit 1
            fi
          done

          # Unzip the dataset
          echo "Extracting $ZIP_NAME..."
          cd OpenRCA
          unzip -qo "$ZIP_NAME" -d dataset/
          rm "$ZIP_NAME"

          # For Market, rename directory from "Market" to "Market/cloudbed-1" etc.
          if [[ "${{ github.event.inputs.dataset }}" == Market/* ]]; then
            SUBDIR=$(echo "${{ github.event.inputs.dataset }}" | cut -d/ -f2)
            if [ -d "dataset/Market/$SUBDIR" ]; then
              mkdir -p "dataset/Market-tmp"
              mv "dataset/Market/$SUBDIR" "dataset/Market-tmp/"
              rm -rf "dataset/Market"
              mv "dataset/Market-tmp" "dataset/Market"
            fi
          fi

      - name: Run CA-LLM RCA Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        timeout-minutes: 120
        run: |
          cd packages/pipeline
          npx tsx benchmark/run-openrca-agent.ts \
            ${{ github.event.inputs.dataset }} \
            ../../OpenRCA/dataset/${{ github.event.inputs.dataset }}

      - name: Evaluate against ground truth
        run: |
          cd OpenRCA
          python -m main.evaluate \
            -p ../test/result/${{ github.event.inputs.dataset }}/agent-ca-llm-deepseek-chat.csv \
            -q dataset/${{ github.event.inputs.dataset }}/query.csv \
            -r ../test/result/report-${{ github.event.inputs.dataset }}.csv

      - name: Upload predictions
        uses: actions/upload-artifact@v4
        with:
          name: openrca-predictions-${{ github.event.inputs.dataset }}
          path: test/result/
          retention-days: 90
