name: OpenRCA Benchmark

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset to evaluate'
        required: true
        type: choice
        options:
          - Telecom
          - Bank
          - Market/cloudbed-1
          - Market/cloudbed-2

permissions:
  contents: read

jobs:
  run-rca-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone OpenRCA framework
        run: git clone https://github.com/microsoft/OpenRCA.git

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r OpenRCA/requirements.txt
          pip install pandas openai gdown

      - name: Build CA packages
        run: |
          pnpm config set approve-builds true
          pnpm install --frozen-lockfile
          pnpm run --filter @agentix-e/causality-analyzer-core build
          pnpm run --filter @agentix-e/causality-analyzer-pipeline build

      - name: Restore dataset cache
        uses: actions/cache@v4
        id: dataset-cache
        with:
          path: OpenRCA/dataset/
          key: openrca-${{ github.event.inputs.dataset }}-v1

      - name: Download dataset from Google Drive
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: |
          cd OpenRCA
          gdown --folder "1wGiEnu4OkWrjPxfx5ZTROnU37-5UDoPM" -O dataset/
          # Keep only selected system to save cache space
          if [ "${{ github.event.inputs.dataset }}" != "Telecom" ]; then rm -rf dataset/Telecom || true; fi
          if [ "${{ github.event.inputs.dataset }}" != "Bank" ]; then rm -rf dataset/Bank || true; fi
          if [[ "${{ github.event.inputs.dataset }}" != Market/* ]]; then rm -rf dataset/Market || true; fi

      - name: Run CA-LLM RCA Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        timeout-minutes: 120
        run: |
          cd packages/pipeline
          npx tsx benchmark/run-openrca-agent.ts \
            ${{ github.event.inputs.dataset }} \
            ../../OpenRCA/dataset/${{ github.event.inputs.dataset }}

      - name: Evaluate against ground truth
        run: |
          cd OpenRCA
          python -m main.evaluate \
            -p ../test/result/${{ github.event.inputs.dataset }}/agent-ca-llm-deepseek-chat.csv \
            -q dataset/${{ github.event.inputs.dataset }}/query.csv \
            -r ../test/result/report-${{ github.event.inputs.dataset }}.csv

      - name: Upload predictions
        uses: actions/upload-artifact@v4
        with:
          name: openrca-predictions-${{ github.event.inputs.dataset }}
          path: test/result/
          retention-days: 90
