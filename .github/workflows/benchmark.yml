name: Benchmark Suite
on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8:00 UTC
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [discovery, estimation, timeseries, all]
        default: discovery

jobs:
  benchmark-discovery:
    if: ${{ github.event.inputs.scope == 'discovery' || github.event.inputs.scope == 'all' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentix-e/causality-analyzer-pipeline build
      - run: pnpm --filter @agentix-e/causality-analyzer-pipeline benchmark:discovery
        timeout-minutes: 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-discovery
          path: packages/pipeline/benchmark-results/

  benchmark-estimation:
    if: ${{ github.event.inputs.scope == 'estimation' || github.event.inputs.scope == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: benchmark-discovery
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentix-e/causality-analyzer-pipeline build
      - run: pnpm --filter @agentix-e/causality-analyzer-pipeline benchmark:estimation
        timeout-minutes: 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-estimation
          path: packages/pipeline/benchmark-results/

  benchmark-timeseries:
    if: ${{ github.event.inputs.scope == 'timeseries' || github.event.inputs.scope == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: benchmark-estimation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentix-e/causality-analyzer-pipeline build
      - run: pnpm --filter @agentix-e/causality-analyzer-pipeline benchmark:timeseries
        timeout-minutes: 50

  report:
    if: always()
    needs: [benchmark-discovery, benchmark-estimation, benchmark-timeseries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with: { pattern: 'benchmark-results-*', path: artifacts/ }
      - run: pnpm --filter @agentix-e/causality-analyzer-pipeline benchmark:report
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: packages/pipeline/benchmark-results/benchmark-report.md
