name: AIOps2025 Benchmark

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'AIOps2025 dataset'
        type: choice
        default: 'sample'
        options:
          - sample
          - full

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: 10 }

      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }

      - name: Install dependencies
        run: |
          pnpm config set approve-builds true
          pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm run --filter @agentix-e/causality-analyzer-core build
          pnpm run --filter @agentix-e/causality-analyzer-pipeline build

      - name: Download AIOps2025 sample data
        run: |
          # AIOps2025 data requires VPN to access aiops.cn
          # Generate synthetic test cases as fallback
          mkdir -p benchmark-data/aiops2025/sample/metric/selected_apm

          # Create input_time.json
          cat > benchmark-data/aiops2025/sample/input_time.json << 'EOF'
          [
            {"uuid": "test-001", "start_time": "2025-07-01 10:00:00", "end_time": "2025-07-01 10:15:00"},
            {"uuid": "test-002", "start_time": "2025-07-01 11:00:00", "end_time": "2025-07-01 11:15:00"},
            {"uuid": "test-003", "start_time": "2025-07-01 14:00:00", "end_time": "2025-07-01 14:10:00"}
          ]
          EOF

          # Generate synthetic metric CSV with fault injection
          python3 -c "
          import csv, random, math
          random.seed(42)
          services = ['frontend','gateway','auth','checkout','cart','payment','inventory','db']
          n_points = 200
          fault_start = 100

          with open('benchmark-data/aiops2025/sample/metric/selected_apm/metrics.csv', 'w') as f:
              w = csv.writer(f)
              w.writerow(['timestamp'] + services)
              for t in range(n_points):
                  row = [t]
                  for name in services:
                      val = 100 + random.gauss(0, 5)
                      # Inject fault in 'checkout' after fault_start
                      if t >= fault_start and name == 'checkout':
                          val *= 1.3
                      # Cascade to 'cart' (downstream)
                      if t >= fault_start + 10 and name == 'cart':
                          val *= 1.15
                      row.append(round(val, 3))
                  w.writerow(row)
          print('Synthetic test data generated')
          " || echo "Python fallback generation failed"

      - name: Run AIOps2025 Benchmark
        run: |
          cd packages/pipeline
          npx tsx benchmark/run-aiops2025-agent.ts ../../benchmark-data/aiops2025/sample/

      - name: Upload predictions
        uses: actions/upload-artifact@v7
        with:
          name: aiops2025-predictions
          path: packages/pipeline/benchmark-results/aiops2025-*.{json,csv}
          retention-days: 90
